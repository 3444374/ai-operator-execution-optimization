<rect x="30" y="783" width="1540" height="82" rx="15" fill="#FFF8F2" stroke="#E85D04" stroke-width="2.5"/><text x="800" y="816" text-anchor="middle" class="sum">现有工作分别优化 AI 算子与计划、数据流水线、模型服务内部请求或代价预测；</text><text x="800" y="851" text-anchor="middle" class="sum">本课题研究数据库作业信息和模型服务状态怎样共同指导上游数据组织与请求提交</text>
