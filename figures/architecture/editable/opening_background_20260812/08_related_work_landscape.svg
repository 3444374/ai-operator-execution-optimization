<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.title{font-size:42px;font-weight:700;fill:#111827}.head{font-size:29px;font-weight:700;fill:#123B82}.name{font-size:27px;font-weight:700;fill:#111827}.venue{font-size:14px;font-weight:500;fill:#475467}.tag{font-size:22px;font-weight:600;fill:#176B62}.focus{font-size:21px;font-weight:600;fill:#123B82}.sum{font-size:29px;font-weight:700;fill:#C55212}.panel{fill:#F8FAFC;stroke:#123B82;stroke-width:2}.card{fill:#FFF;stroke:#315A9A;stroke-width:1.6}.rule{stroke:#315A9A;stroke-width:1.5}</style>
<rect width="1600" height="900" fill="#FFF"/><text x="800" y="64" text-anchor="middle" class="title">相关工作：数据库 AI、数据执行、模型服务与代价估计</text>

