<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .cn{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}.title{font-size:42px;font-weight:700;fill:#111827}.section{font-size:30px;font-weight:700}.cardtitle{font-size:25px;font-weight:700;fill:#111827}.body{font-size:20px;fill:#374151}.small{font-size:20px;fill:#6B7280}.num{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 14 6 0 12z" fill="#165DCC"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 14 6 0 12z" fill="#5B2AA6"/></marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 11 5 0 10z" fill="#6B7280"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <rect x="48" y="28" width="70" height="54" rx="10" fill="#165DCC"/>
  <text class="cn" x="83" y="64" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">01</text>
  <text class="cn title" x="140" y="68">研究空白：数据库与模型服务之间的 AI Data Execution Layer</text>
  <text class="cn small" x="1550" y="104" text-anchor="end">开题第 5 页｜研究问题</text>

  <text class="cn section" x="225" y="138" text-anchor="middle" fill="#165DCC">数据库侧（已有能力）</text>
  <text class="cn section" x="800" y="138" text-anchor="middle" fill="#E85D04">尚缺少的跨层能力</text>
  <text class="cn section" x="1375" y="138" text-anchor="middle" fill="#5B2AA6">模型服务侧（已有能力）</text>

  <rect x="50" y="155" width="350" height="515" rx="18" fill="#F7FAFF" stroke="#165DCC" stroke-width="2"/>
  <rect x="470" y="148" width="660" height="529" rx="18" fill="#FFFBF7" stroke="#E85D04" stroke-width="2" stroke-dasharray="10 7"/>
  <rect x="1200" y="155" width="350" height="515" rx="18" fill="#FBF9FF" stroke="#5B2AA6" stroke-width="2"/>

  <g>
    <rect x="70" y="185" width="310" height="118" rx="14" fill="#fff" stroke="#165DCC" stroke-width="1.5"/>
    <image href="data:image/svg+xml;base64," x="84" y="210" width="66" height="66"/>
    <text class="cn cardtitle" x="160" y="230">任务与数据语义</text>
    <text class="cn body" x="160" y="270">行 / 查询 / Job / SLO</text>
  </g>
  <g>
    <rect x="70" y="320" width="310" height="118" rx="14" fill="#fff" stroke="#165DCC" stroke-width="1.5"/>
    <image href="data:image/svg+xml;base64," x="84" y="346" width="66" height="66"/>
    <text class="cn cardtitle" x="160" y="365">事务与执行边界</text>
    <text class="cn body" x="160" y="405">source / 结果 / 写回</text>
  </g>
  <g>
    <rect x="70" y="455" width="310" height="185" rx="14" fill="#EEF5FF" stroke="#165DCC" stroke-width="1.5"/>
    <image href="data:image/svg+xml;base64," x="84" y="480" width="66" height="66"/>
    <text class="cn cardtitle" x="160" y="505" fill="#165DCC">数据库通常不可见</text>
    <text class="cn body" x="160" y="548"><tspan x="160">running / waiting / KV</tspan><tspan x="160" dy="34">模型服务完成节奏</tspan></text>
  </g>

  <g>
    <rect x="500" y="185" width="600" height="128" rx="14" fill="#fff" stroke="#E85D04" stroke-width="1.8"/>
    <image href="data:image/svg+xml;base64," x="524" y="216" width="66" height="66"/>
    <circle cx="628" cy="221" r="20" fill="#E85D04"/><text class="num" x="628" y="222">1</text>
    <text class="cn cardtitle" x="662" y="228">工作量表达不一致</text>
    <text class="cn body" x="662" y="270"><tspan x="662">数据库以记录与批次描述任务</tspan><tspan x="662" dy="32">模型执行受输入、准备与输出规模影响</tspan></text>
  </g>
  <g>
    <rect x="500" y="330" width="600" height="145" rx="14" fill="#fff" stroke="#E85D04" stroke-width="1.8"/>
    <image href="data:image/svg+xml;base64," x="524" y="370" width="66" height="66"/>
    <circle cx="628" cy="367" r="20" fill="#E85D04"/><text class="num" x="628" y="368">2</text>
    <text class="cn cardtitle" x="658" y="375">运行状态难以对应作业</text>
    <text class="cn body" x="658" y="418"><tspan x="658">服务侧可见队列与资源状态</tspan><tspan x="658" dy="32">数据库侧需要 Job 进度与服务目标</tspan></text>
  </g>
  <g>
    <rect x="500" y="495" width="600" height="145" rx="14" fill="#FFF3E9" stroke="#E85D04" stroke-width="1.8"/>
    <image href="data:image/svg+xml;base64," x="524" y="535" width="66" height="66"/>
    <circle cx="628" cy="534" r="20" fill="#E85D04"/><text class="num" x="628" y="535">3</text>
    <text class="cn cardtitle" x="668" y="542">多作业缺少共同约束</text>
    <text class="cn body" x="668" y="584"><tspan x="668">独立提交容易产生排队与干扰</tspan><tspan x="668" dy="32">效率、隔离与公平需要同时评价</tspan></text>
  </g>

  <g>
    <rect x="1220" y="185" width="310" height="118" rx="14" fill="#fff" stroke="#5B2AA6" stroke-width="1.5"/>
    <image href="data:image/svg+xml;base64," x="1238" y="210" width="66" height="66"/>
    <text class="cn cardtitle" x="1310" y="230">文本生成</text><text class="cn body" x="1310" y="270">vLLM / Completion</text>
  </g>
  <g>
    <rect x="1220" y="320" width="310" height="118" rx="14" fill="#fff" stroke="#5B2AA6" stroke-width="1.5"/>
    <image href="data:image/svg+xml;base64," x="1238" y="346" width="66" height="66"/>
    <text class="cn cardtitle" x="1310" y="365">图像表征 / 分类</text><text class="cn body" x="1310" y="405">CLIP / ViT</text>
  </g>
  <g>
    <rect x="1220" y="455" width="310" height="185" rx="14" fill="#F5F0FF" stroke="#5B2AA6" stroke-width="1.5"/>
    <image href="data:image/svg+xml;base64," x="1238" y="480" width="66" height="66"/>
    <text class="cn cardtitle" x="1310" y="505" fill="#5B2AA6">模型服务所见</text>
    <text class="cn body" x="1310" y="548"><tspan x="1310">可见：队列 / KV / 完成</tspan><tspan x="1310" dy="32">缺少：source / Job</tspan><tspan x="1310" dy="32">locality / sink</tspan></text>
  </g>

  <path d="M405 397H465" fill="none" stroke="#165DCC" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text class="cn" x="435" y="378" text-anchor="middle" font-size="20" fill="#165DCC">请求</text>
  <path d="M1135 397H1195" fill="none" stroke="#5B2AA6" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <text class="cn" x="1165" y="378" text-anchor="middle" font-size="20" fill="#5B2AA6">提交</text>
  <path d="M1195 618H1135" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
  <text class="cn small" x="1165" y="604" text-anchor="middle">反馈流</text>

  <rect x="190" y="724" width="1220" height="72" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
  <text class="cn" x="800" y="770" text-anchor="middle" font-size="26" font-weight="700" fill="#15803D">研究问题：如何连接数据库任务语义与模型服务运行信息，并约束多作业外部执行？</text>
</svg>
