<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .cn{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
      .title{font-size:42px;font-weight:700}
      .subtitle{font-size:20px;fill:#6B7280}
      .section{font-size:28px;font-weight:700}
      .cardtitle{font-size:22px;font-weight:700}
      .body{font-size:18px;fill:#374151}
      .small{font-size:16px;fill:#6B7280}
    </style>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#165DCC"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E85D04"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#15803D"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6B7280"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="40" y="26" width="72" height="58" rx="11" fill="#165DCC"/>
  <text class="cn" x="76" y="67" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">02</text>
  <text class="cn title" x="135" y="66">数据库记录的组织、提交、模型执行与结果返回</text>
  <text class="cn subtitle" x="138" y="105">工作描述连接数据组织与外部执行；运行状态返回提交与路由模块</text>

  <rect x="30" y="175" width="270" height="505" rx="18" fill="#FFFFFF" stroke="#165DCC" stroke-width="2.5"/>
  <path d="M30 193a18 18 0 0 1 18-18h234a18 18 0 0 1 18 18v62H30Z" fill="#165DCC"/>
  <text class="cn section" x="165" y="224" text-anchor="middle" fill="#FFFFFF">数据源与数据引擎</text>
  <g transform="translate(66 286)">
    <ellipse cx="38" cy="12" rx="34" ry="12" fill="none" stroke="#165DCC" stroke-width="4"/>
    <path d="M4 12v54c0 8 15 14 34 14s34-6 34-14V12M4 38c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#165DCC" stroke-width="4"/>
  </g>
  <text class="cn cardtitle" x="150" y="316">PostgreSQL</text>
  <text class="cn body" x="150" y="342"><tspan x="150">提示词、图像</tspan><tspan x="150" dy="28">作业与查询信息</tspan><tspan x="150" dy="28">结果写回要求</tspan></text>
  <line x1="58" y1="405" x2="272" y2="405" stroke="#CBD5E1" stroke-width="1.5"/>
  <text class="cn" x="72" y="465" font-size="46" font-weight="700" fill="#111827">d</text>
  <rect x="111" y="429" width="28" height="55" fill="#E600E6"/>
  <text class="cn cardtitle" x="150" y="452">Daft</text>
  <text class="cn body" x="150" y="486"><tspan x="150">DataFrame 数据处理</tspan><tspan x="150" dy="30">扫描、分区与批次转换</tspan></text>
  <rect x="58" y="590" width="214" height="52" rx="10" fill="#EFF6FF" stroke="#165DCC" stroke-width="1.5"/>
  <text class="cn" x="165" y="623" text-anchor="middle" font-size="19" font-weight="700" fill="#0F3F9E">统一输入字段</text>

  <rect x="330" y="150" width="900" height="530" rx="22" fill="#FFFCF8" stroke="#E85D04" stroke-width="2.5" stroke-dasharray="11 8"/>
  <text class="cn section" x="365" y="191" fill="#E85D04">AI 数据执行层</text>
  <rect x="365" y="210" width="390" height="42" rx="9" fill="#EFF6FF" stroke="#165DCC" stroke-width="1.5"/>
  <text class="cn" x="560" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#0F3F9E">研究内容一：工作描述与数据组织</text>
  <rect x="770" y="210" width="425" height="42" rx="9" fill="#FFF4EA" stroke="#E85D04" stroke-width="1.5"/>
  <text class="cn" x="982" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#C2410C">研究内容二：提交控制与多作业调度</text>

  <rect x="365" y="274" width="250" height="72" rx="12" fill="#FFF7ED" stroke="#E85D04" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="cn cardtitle" x="490" y="303" text-anchor="middle" fill="#C2410C">AI 算子代价估计</text>
  <text class="cn small" x="490" y="326" text-anchor="middle"><tspan x="490">输入：工作描述、历史测量</tspan><tspan x="490" dy="21">输出：预计时间、资源需求</tspan></text>
  <path d="M615 310H665" fill="none" stroke="#E85D04" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#orange-arrow)"/>
  <rect x="674" y="274" width="270" height="72" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
  <text class="cn cardtitle" x="809" y="304" text-anchor="middle" fill="#15803D">数据库优化器 / 多 SQL 调度</text>
  <text class="cn small" x="809" y="330" text-anchor="middle">比较算子执行代价与候选执行安排</text>

  <rect x="365" y="385" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#165DCC" stroke-width="2"/>
  <text class="cn cardtitle" x="468" y="420" text-anchor="middle" fill="#0F3F9E">工作描述</text>
  <text class="cn small" x="468" y="445" text-anchor="middle">WorkDescriptor</text>
  <text class="cn body" x="390" y="478"><tspan x="390">阶段工作 · 数据局部性</tspan><tspan x="390" dy="30">作业身份 · 服务信息</tspan></text>

  <rect x="600" y="385" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#165DCC" stroke-width="2"/>
  <text class="cn cardtitle" x="703" y="420" text-anchor="middle" fill="#0F3F9E">数据组织</text>
  <text class="cn body" x="622" y="460"><tspan x="622">批次工作量上限 · 均衡</tspan><tspan x="622" dy="30">局部性 → 批次请求</tspan></text>

  <rect x="835" y="385" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#E85D04" stroke-width="2"/>
  <text class="cn cardtitle" x="938" y="420" text-anchor="middle" fill="#C2410C">提交控制</text>
  <text class="cn body" x="857" y="458"><tspan x="857">运行前测得的请求数</tspan><tspan x="857" dy="28">和工作量上限</tspan><tspan x="857" dy="28">结合当前状态调节提交</tspan></text>

  <rect x="1070" y="385" width="135" height="146" rx="14" fill="#FFFFFF" stroke="#E85D04" stroke-width="2"/>
  <text class="cn cardtitle" x="1138" y="418" text-anchor="middle" fill="#C2410C">路由与</text>
  <text class="cn cardtitle" x="1138" y="446" text-anchor="middle" fill="#C2410C">多作业调度</text>
  <text class="cn" x="1138" y="462" text-anchor="middle" font-size="15" fill="#6B7280"><tspan x="1138">作业选择</tspan><tspan x="1138" dy="20">服务实例选择</tspan><tspan x="1138" dy="20">完成后释放</tspan><tspan x="1138" dy="20">请求数和工作量</tspan></text>

  <path d="M300 455H356" fill="none" stroke="#165DCC" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M570 458H591" fill="none" stroke="#165DCC" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M805 458H826" fill="none" stroke="#E85D04" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <path d="M1040 458H1061" fill="none" stroke="#E85D04" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <path d="M468 385V354H490V346" fill="none" stroke="#E85D04" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#orange-arrow)"/>

  <rect x="365" y="565" width="840" height="78" rx="12" fill="#FFF7ED" stroke="#E85D04" stroke-width="1.5"/>
  <text class="cn" x="785" y="596" text-anchor="middle" font-size="18" font-weight="700" fill="#C2410C">实验比较：在相同请求数和工作量上限下比较固定参数方法与候选方法</text>
  <text class="cn small" x="785" y="624" text-anchor="middle">分别观察总体吞吐、作业完成时间、服务均衡和模型服务状态</text>

  <rect x="1260" y="205" width="305" height="380" rx="18" fill="#FAF7FF" stroke="#5B2AA6" stroke-width="2.5"/>
  <path d="M1260 223a18 18 0 0 1 18-18h269a18 18 0 0 1 18 18v57h-305Z" fill="#5B2AA6"/>
  <text class="cn section" x="1412" y="257" text-anchor="middle" fill="#FFFFFF">模型执行服务</text>
  <rect x="1290" y="310" width="245" height="86" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="cn cardtitle" x="1412" y="344" text-anchor="middle" fill="#5B2AA6">文本生成</text>
  <text class="cn body" x="1412" y="376" text-anchor="middle">提示词 → vLLM</text>
  <rect x="1290" y="415" width="245" height="86" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="cn cardtitle" x="1412" y="449" text-anchor="middle" fill="#5B2AA6">图像表征 / 分类</text>
  <text class="cn body" x="1412" y="481" text-anchor="middle">图像张量 → CLIP / ViT</text>
  <text class="cn" x="1412" y="532" text-anchor="middle" font-size="15" fill="#374151"><tspan x="1412">可观测：排队、运行、KV 缓存</tspan><tspan x="1412" dy="22">与请求完成速度</tspan></text>
  <path d="M1205 458H1251" fill="none" stroke="#5B2AA6" stroke-width="4" marker-end="url(#blue-arrow)"/>

  <rect x="1260" y="605" width="305" height="75" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text class="cn cardtitle" x="1412" y="636" text-anchor="middle" fill="#15803D">结果收集与写回</text>
  <text class="cn" x="1412" y="660" text-anchor="middle" font-size="14" fill="#6B7280">PostgreSQL / pgvector · 结果完整性检查</text>
  <path d="M1412 585V596" fill="none" stroke="#15803D" stroke-width="4" marker-end="url(#green-arrow)"/>

  <rect x="330" y="715" width="1235" height="130" rx="16" fill="#F8FAFC" stroke="#6B7280" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="cn cardtitle" x="948" y="747" text-anchor="middle" fill="#374151">运行状态记录（RuntimeStateSnapshot）与执行记录（Trace）</text>
  <text class="cn small" x="948" y="772" text-anchor="middle">运行时采集的实际状态，不等同于代价估计结果</text>
  <rect x="365" y="785" width="260" height="44" rx="9" fill="#FFFFFF" stroke="#94A3B8"/>
  <text class="cn small" x="495" y="812" text-anchor="middle">阶段：可提交 / 进行中 / 已完成</text>
  <rect x="640" y="785" width="300" height="44" rx="9" fill="#FFFFFF" stroke="#94A3B8"/>
  <text class="cn small" x="790" y="812" text-anchor="middle">服务：排队 / 运行 / KV 缓存 / 完成速度</text>
  <rect x="955" y="785" width="260" height="44" rx="9" fill="#FFFFFF" stroke="#94A3B8"/>
  <text class="cn small" x="1085" y="812" text-anchor="middle">作业：到达 / 剩余工作 / 已完成</text>
  <rect x="1230" y="785" width="300" height="44" rx="9" fill="#FFFFFF" stroke="#94A3B8"/>
  <text class="cn small" x="1380" y="812" text-anchor="middle">资源：GPU / 队列等待时间 / 利用率</text>
  <path d="M1412 680V706" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#gray-arrow)"/>
  <path d="M790 715V690H938V540" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#gray-arrow)"/>
  <path d="M1085 715V690H1138V540" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#gray-arrow)"/>
  <text class="cn small" x="1016" y="703" text-anchor="middle">状态返回</text>

  <text class="cn small" x="40" y="882">文本与图像共用：工作描述 · 数据组织 · 工作量上限 · 作业队列 · 路由 · 运行状态记录</text>
</svg>
