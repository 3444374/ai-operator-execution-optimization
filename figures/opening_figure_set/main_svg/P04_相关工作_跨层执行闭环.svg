<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.title{font-size:42px;font-weight:700;fill:#111827}.head{font-size:29px;font-weight:700;fill:#123B82}.name{font-size:27px;font-weight:700;fill:#111827}.tag{font-size:22px;font-weight:600;fill:#176B62}.focus{font-size:21px;font-weight:600;fill:#123B82}.sum{font-size:29px;font-weight:700;fill:#C55212}.panel{fill:#F8FAFC;stroke:#123B82;stroke-width:2}.card{fill:#FFF;stroke:#315A9A;stroke-width:1.6}.rule{stroke:#315A9A;stroke-width:1.5}</style>
<rect width="1600" height="900" fill="#FFF"/><text x="800" y="64" text-anchor="middle" class="title">相关工作分层：数据库、数据执行与模型服务分别演进</text>

<!-- column 1 -->
<g><rect x="30" y="100" width="370" height="655" rx="16" class="panel"/><text x="215" y="145" text-anchor="middle" class="head">数据库 AI</text>
<g><rect x="48" y="168" width="334" height="118" rx="12" class="card"/><text x="215" y="205" text-anchor="middle" class="name">LOTUS</text><text x="215" y="239" text-anchor="middle" class="tag">语义算子</text><text x="215" y="267" text-anchor="middle" class="tag">质量—成本优化</text></g>
<g><rect x="48" y="300" width="334" height="118" rx="12" class="card"/><text x="215" y="337" text-anchor="middle" class="name">Galois</text><text x="215" y="371" text-anchor="middle" class="tag">SQL over LLM</text><text x="215" y="399" text-anchor="middle" class="tag">逻辑 / 物理计划</text></g>
<g><rect x="48" y="432" width="334" height="118" rx="12" class="card"/><text x="215" y="469" text-anchor="middle" class="name">GaussML</text><text x="215" y="503" text-anchor="middle" class="tag">库内 AI / ML</text><text x="215" y="531" text-anchor="middle" class="tag">计划与执行</text></g>
<g><rect x="48" y="564" width="334" height="118" rx="12" class="card"/><text x="215" y="601" text-anchor="middle" class="name">Cortex AISQL</text><text x="215" y="635" text-anchor="middle" class="tag">AI SQL 接口</text><text x="215" y="663" text-anchor="middle" class="tag">调用与查询重排</text></g>
<line x1="48" y1="702" x2="382" y2="702" class="rule"/><text x="215" y="735" text-anchor="middle" class="focus">关注：算子语义与查询计划</text></g>

<!-- column 2 -->
<g><rect x="420" y="100" width="370" height="655" rx="16" class="panel"/><text x="605" y="145" text-anchor="middle" class="head">数据执行</text>
<g><rect x="438" y="168" width="334" height="150" rx="12" class="card"/><text x="605" y="215" text-anchor="middle" class="name">Ray Data</text><text x="605" y="256" text-anchor="middle" class="tag">blocks / stages</text><text x="605" y="289" text-anchor="middle" class="tag">streaming backpressure</text></g>
<g><rect x="438" y="336" width="334" height="150" rx="12" class="card"/><text x="605" y="383" text-anchor="middle" class="name">Daft</text><text x="605" y="424" text-anchor="middle" class="tag">records / partitions</text><text x="605" y="457" text-anchor="middle" class="tag">batching / locality</text></g>
<g><rect x="438" y="504" width="334" height="150" rx="12" class="card"/><text x="605" y="551" text-anchor="middle" class="name">NeuStream</text><text x="605" y="592" text-anchor="middle" class="tag">stream pipeline</text><text x="605" y="625" text-anchor="middle" class="tag">module-level batching</text></g>
<line x1="438" y1="702" x2="772" y2="702" class="rule"/><text x="605" y="735" text-anchor="middle" class="focus">关注：数据阶段与反压</text></g>

<!-- column 3 -->
<g><rect x="810" y="100" width="370" height="655" rx="16" class="panel"/><text x="995" y="145" text-anchor="middle" class="head">推理服务</text>
<g><rect x="828" y="168" width="334" height="118" rx="12" class="card"/><text x="995" y="205" text-anchor="middle" class="name">Orca</text><text x="995" y="239" text-anchor="middle" class="tag">iteration scheduling</text><text x="995" y="267" text-anchor="middle" class="tag">request lifecycle</text></g>
<g><rect x="828" y="300" width="334" height="118" rx="12" class="card"/><text x="995" y="337" text-anchor="middle" class="name">vLLM</text><text x="995" y="371" text-anchor="middle" class="tag">PagedAttention</text><text x="995" y="399" text-anchor="middle" class="tag">continuous batching</text></g>
<g><rect x="828" y="432" width="334" height="118" rx="12" class="card"/><text x="995" y="469" text-anchor="middle" class="name">Sarathi-Serve</text><text x="995" y="503" text-anchor="middle" class="tag">chunked prefill</text><text x="995" y="531" text-anchor="middle" class="tag">stall-free batching</text></g>
<g><rect x="828" y="564" width="334" height="118" rx="12" class="card"/><text x="995" y="601" text-anchor="middle" class="name">VTC</text><text x="995" y="635" text-anchor="middle" class="tag">service counter</text><text x="995" y="663" text-anchor="middle" class="tag">multi-tenant fairness</text></g>
<line x1="828" y1="702" x2="1162" y2="702" class="rule"/><text x="995" y="735" text-anchor="middle" class="focus">关注：KV、批处理与公平</text></g>

<!-- column 4 -->
<g><rect x="1200" y="100" width="370" height="655" rx="16" class="panel"/><text x="1385" y="145" text-anchor="middle" class="head">代价与决策</text>
<g><rect x="1218" y="168" width="334" height="118" rx="12" class="card"/><text x="1385" y="205" text-anchor="middle" class="name">Learned Cost Models</text><text x="1385" y="239" text-anchor="middle" class="tag">plan features</text><text x="1385" y="267" text-anchor="middle" class="tag">runtime prediction</text></g>
<g><rect x="1218" y="300" width="334" height="118" rx="12" class="card"/><text x="1385" y="337" text-anchor="middle" class="name">GRACEFUL</text><text x="1385" y="371" text-anchor="middle" class="tag">UDF structure</text><text x="1385" y="399" text-anchor="middle" class="tag">execution-time estimate</text></g>
<g><rect x="1218" y="432" width="334" height="118" rx="12" class="card"/><text x="1385" y="469" text-anchor="middle" class="name">COSTREAM</text><text x="1385" y="503" text-anchor="middle" class="tag">streaming costs</text><text x="1385" y="531" text-anchor="middle" class="tag">operator placement</text></g>
<g><rect x="1218" y="564" width="334" height="118" rx="12" class="card"/><text x="1385" y="601" text-anchor="middle" class="name">Abacus</text><text x="1385" y="635" text-anchor="middle" class="tag">quality / cost / latency</text><text x="1385" y="663" text-anchor="middle" class="tag">Pareto plan search</text></g>
<line x1="1218" y1="702" x2="1552" y2="702" class="rule"/><text x="1385" y="735" text-anchor="middle" class="focus">关注：估计、放置与计划选择</text></g>

<rect x="30" y="783" width="1540" height="82" rx="15" fill="#FFF8F2" stroke="#E85D04" stroke-width="2.5"/><text x="800" y="816" text-anchor="middle" class="sum">现有工作主要优化数据库语义、数据流水线或模型服务内部机制；</text><text x="800" y="851" text-anchor="middle" class="sum">数据库任务语义与模型服务运行信息之间的衔接仍不充分</text>
</svg>
