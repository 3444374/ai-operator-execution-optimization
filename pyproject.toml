[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Start with correctness-oriented rules that the existing repository satisfies.
# Import ordering and full formatting can be enabled after the profiler split,
# without mixing thousands of style-only lines into mechanism changes.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E731"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
