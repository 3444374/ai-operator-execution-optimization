<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .cn{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
      .title{font-size:42px;font-weight:700}
      .subtitle{font-size:20px;fill:#6B7280}
      .section{font-size:28px;font-weight:700}
      .cardtitle{font-size:22px;font-weight:700}
      .body{font-size:18px;fill:#374151}
      .small{font-size:16px;fill:#6B7280}
    </style>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#165DCC"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E85D04"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5B2AA6"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#15803D"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6B7280"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="40" y="26" width="72" height="58" rx="11" fill="#165DCC"/>
  <text class="cn" x="76" y="67" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">02</text>
  <text class="cn title" x="135" y="66">数据库记录的组织、提交、模型执行与结果返回</text>
  <text class="cn subtitle" x="138" y="105">工作描述连接数据组织与外部执行；运行状态返回提交与路由模块</text>

  <rect x="30" y="175" width="270" height="505" rx="18" fill="#FFFFFF" stroke="#165DCC" stroke-width="2.5"/>
  <path d="M30 193a18 18 0 0 1 18-18h234a18 18 0 0 1 18 18v62H30Z" fill="#165DCC"/>
  <text class="cn section" x="165" y="224" text-anchor="middle" fill="#FFFFFF">数据源与数据引擎</text>
  <g transform="translate(66 286)">
    <ellipse cx="38" cy="12" rx="34" ry="12" fill="none" stroke="#165DCC" stroke-width="4"/>
    <path d="M4 12v54c0 8 15 14 34 14s34-6 34-14V12M4 38c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#165DCC" stroke-width="4"/>
  </g>
  <text class="cn cardtitle" x="150" y="316">PostgreSQL</text>
  <text class="cn body" x="150" y="342"><tspan x="150">提示词、图像</tspan><tspan x="150" dy="28">作业与查询信息</tspan><tspan x="150" dy="28">结果写回要求</tspan></text>
  <line x1="58" y1="405" x2="272" y2="405" stroke="#CBD5E1" stroke-width="1.5"/>
  <text class="cn" x="72" y="465" font-size="46" font-weight="700" fill="#111827">d</text>
  <rect x="111" y="429" width="28" height="55" fill="#E600E6"/>
  <text class="cn cardtitle" x="150" y="452">Daft</text>
  <text class="cn" x="150" y="480" font-size="17" fill="#374151"><tspan x="150">DataFrame</tspan><tspan x="150" dy="24">数据处理</tspan><tspan x="150" dy="24">扫描与分区</tspan><tspan x="150" dy="24">批次转换</tspan></text>
  <rect x="58" y="590" width="214" height="52" rx="10" fill="#EFF6FF" stroke="#165DCC" stroke-width="1.5"/>
  <text class="cn" x="165" y="623" text-anchor="middle" font-size="19" font-weight="700" fill="#0F3F9E">统一输入字段</text>

  <rect x="330" y="150" width="900" height="415" rx="22" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5" stroke-dasharray="11 8"/>
  <text class="cn section" x="365" y="191" fill="#374151">AI 数据执行层</text>
  <rect x="365" y="210" width="390" height="42" rx="9" fill="#EFF6FF" stroke="#165DCC" stroke-width="1.5"/>
  <text class="cn" x="560" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#0F3F9E">研究内容一：工作描述与数据组织</text>
  <rect x="770" y="210" width="425" height="42" rx="9" fill="#FFF4EA" stroke="#E85D04" stroke-width="1.5"/>
  <text class="cn" x="982" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#C2410C">研究内容二：提交、路由与多作业调度</text>

  <rect x="365" y="270" width="375" height="80" rx="12" fill="#F5F0FF" stroke="#5B2AA6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="cn cardtitle" x="553" y="299" text-anchor="middle" fill="#5B2AA6">AI 算子代价估计</text>
  <text class="cn small" x="553" y="320" text-anchor="middle"><tspan x="553">输入：工作描述、历史测量</tspan><tspan x="553" dy="20">输出：预计时间、资源需求</tspan></text>
  <path d="M740 310H776" fill="none" stroke="#5B2AA6" stroke-width="2" marker-end="url(#purple-arrow)"/>
  <rect x="785" y="270" width="410" height="80" rx="12" fill="#F5F0FF" stroke="#5B2AA6" stroke-width="1.5"/>
  <text class="cn cardtitle" x="990" y="300" text-anchor="middle" fill="#5B2AA6">数据库优化器 / 多 SQL 调度</text>
  <text class="cn small" x="990" y="330" text-anchor="middle">比较算子执行代价与候选执行安排</text>

  <rect x="365" y="385" width="180" height="146" rx="14" fill="#FFFFFF" stroke="#165DCC" stroke-width="2"/>
  <text class="cn cardtitle" x="455" y="412" text-anchor="middle" fill="#0F3F9E">工作描述</text>
  <text class="cn small" x="455" y="438" text-anchor="middle">WorkDescriptor</text>
  <text class="cn" x="455" y="470" text-anchor="middle" font-size="17" fill="#374151"><tspan x="455">分阶段工作</tspan><tspan x="455" dy="23">数据局部性</tspan><tspan x="455" dy="23">作业身份 · 服务信息</tspan></text>

  <rect x="575" y="385" width="180" height="146" rx="14" fill="#FFFFFF" stroke="#165DCC" stroke-width="2"/>
  <text class="cn cardtitle" x="665" y="412" text-anchor="middle" fill="#0F3F9E">数据组织</text>
  <text class="cn" x="665" y="466" text-anchor="middle" font-size="17" fill="#374151"><tspan x="665">批次工作量上限</tspan><tspan x="665" dy="24">均衡 · 局部性</tspan><tspan x="665" dy="24">形成批次请求</tspan></text>

  <rect x="785" y="385" width="200" height="146" rx="14" fill="#FFFFFF" stroke="#E85D04" stroke-width="2"/>
  <text class="cn cardtitle" x="885" y="412" text-anchor="middle" fill="#C2410C">提交控制</text>
  <text class="cn" x="885" y="456" text-anchor="middle" font-size="16" fill="#374151"><tspan x="885">运行前测得的</tspan><tspan x="885" dy="20">请求数与工作量上限</tspan><tspan x="885" dy="20">结合当前状态</tspan><tspan x="885" dy="20">调节提交</tspan></text>

  <rect x="1015" y="385" width="190" height="146" rx="14" fill="#FFFFFF" stroke="#E85D04" stroke-width="2"/>
  <text class="cn cardtitle" x="1110" y="412" text-anchor="middle" fill="#C2410C">路由与</text>
  <text class="cn cardtitle" x="1110" y="438" text-anchor="middle" fill="#C2410C">多作业调度</text>
  <text class="cn" x="1110" y="468" text-anchor="middle" font-size="15" fill="#6B7280"><tspan x="1110">作业与服务实例选择</tspan><tspan x="1110" dy="22">完成后释放</tspan><tspan x="1110" dy="22">请求数与工作量</tspan></text>

  <path d="M300 455H356" fill="none" stroke="#165DCC" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M545 458H566" fill="none" stroke="#165DCC" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M755 458H776" fill="none" stroke="#E85D04" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
  <path d="M985 458H1006" fill="none" stroke="#E85D04" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
  <path d="M455 385V359" fill="none" stroke="#5B2AA6" stroke-width="2" marker-end="url(#purple-arrow)"/>

  <rect x="1260" y="170" width="305" height="370" rx="18" fill="#FAF7FF" stroke="#5B2AA6" stroke-width="2.5"/>
  <path d="M1260 188a18 18 0 0 1 18-18h269a18 18 0 0 1 18 18v57h-305Z" fill="#5B2AA6"/>
  <text class="cn section" x="1412" y="222" text-anchor="middle" fill="#FFFFFF">模型执行服务</text>
  <rect x="1290" y="275" width="245" height="86" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="cn cardtitle" x="1412" y="309" text-anchor="middle" fill="#5B2AA6">文本生成</text>
  <text class="cn body" x="1412" y="341" text-anchor="middle">提示词 → vLLM</text>
  <rect x="1290" y="380" width="245" height="86" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="cn cardtitle" x="1412" y="414" text-anchor="middle" fill="#5B2AA6">图像表征 / 分类</text>
  <text class="cn body" x="1412" y="446" text-anchor="middle">图像张量 → CLIP / ViT</text>
  <text class="cn" x="1412" y="497" text-anchor="middle" font-size="15" fill="#374151"><tspan x="1412">可观测：排队、运行、KV 缓存</tspan><tspan x="1412" dy="22">与请求完成速度</tspan></text>
  <path d="M1205 458H1251" fill="none" stroke="#5B2AA6" stroke-width="3" marker-end="url(#purple-arrow)"/>

  <rect x="1260" y="565" width="305" height="70" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text class="cn cardtitle" x="1412" y="593" text-anchor="middle" fill="#15803D">结果收集与写回</text>
  <text class="cn" x="1412" y="618" text-anchor="middle" font-size="14" fill="#6B7280">PostgreSQL / pgvector · 结果完整性检查</text>
  <path d="M1412 540V556" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#green-arrow)"/>

  <rect x="330" y="660" width="1235" height="125" rx="16" fill="#F8FAFC" stroke="#6B7280" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="cn cardtitle" x="948" y="692" text-anchor="middle" fill="#374151">运行状态记录（RuntimeStateSnapshot）与执行记录（Trace）</text>
  <text class="cn small" x="948" y="716" text-anchor="middle">运行时采集的实际状态，不等同于代价估计结果</text>
  <rect x="365" y="732" width="260" height="40" rx="9" fill="#FFFFFF" stroke="#94A3B8"/>
  <text class="cn small" x="495" y="757" text-anchor="middle">阶段：可提交 / 进行中 / 已完成</text>
  <rect x="640" y="732" width="300" height="40" rx="9" fill="#FFFFFF" stroke="#94A3B8"/>
  <text class="cn small" x="790" y="757" text-anchor="middle">服务：排队 / 运行 / KV 缓存 / 完成速度</text>
  <rect x="955" y="732" width="260" height="40" rx="9" fill="#FFFFFF" stroke="#94A3B8"/>
  <text class="cn small" x="1085" y="757" text-anchor="middle">作业：到达 / 剩余工作 / 已完成</text>
  <rect x="1230" y="732" width="300" height="40" rx="9" fill="#FFFFFF" stroke="#94A3B8"/>
  <text class="cn small" x="1380" y="757" text-anchor="middle">资源：GPU / 队列等待时间 / 利用率</text>
  <path d="M1412 635V651" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gray-arrow)"/>
  <path d="M885 660V540" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gray-arrow)"/>
  <path d="M1110 660V540" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gray-arrow)"/>
  <text class="cn small" x="998" y="644" text-anchor="middle">状态返回</text>

  <text class="cn small" x="40" y="820">文本与图像共用：工作描述 · 数据组织 · 工作量上限 · 作业队列 · 路由 · 运行状态记录</text>
</svg>
